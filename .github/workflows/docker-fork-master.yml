name: Build Fork Docker Image

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-fork-master-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'cheese-work/actual'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'

      - name: Build server with translations
        run: yarn build:server

      - name: Log in to GitHub Container Registry
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

      - name: Build and push Ubuntu image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: packages/sync-server/docker/ubuntu.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/actual-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/actual:${{ github.sha }}

      - name: Check current master
        id: current-master
        shell: bash
        run: |
          set -euo pipefail
          latest_sha=$(git ls-remote https://github.com/cheese-work/actual.git refs/heads/master | cut -f1)
          echo "is_current=$([[ "$latest_sha" == "$GITHUB_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Update master tags
        if: steps.current-master.outputs.is_current == 'true'
        shell: bash
        run: |
          docker buildx imagetools create --tag ghcr.io/cheese-work/actual-server:master ghcr.io/cheese-work/actual-server:${GITHUB_SHA}
          docker buildx imagetools create --tag ghcr.io/cheese-work/actual:master ghcr.io/cheese-work/actual:${GITHUB_SHA}
