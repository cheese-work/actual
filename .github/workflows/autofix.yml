name: autofix.ci

defaults:
  run:
    shell: bash

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      # Native replacement for the autofix-ci/action app: it is not installed on
      # this fork (every run failed with "autofix.ci app is not installed"), and
      # the app only pushed commits, it never blocked. This gate keeps the
      # format/type-aware-lint enforcement without any app, token or write
      # permission: apply the fixes, publish the patch, fail if the fix step
      # failed or changed anything. It does not commit; apply the patch (or run
      # `yarn lint:fix`).
      #
      # The patch is collected after the fix step succeeds OR fails (a mixed
      # change, e.g. fixable formatting plus a non-autofixable type-aware error,
      # exits non-zero but still leaves a useful patch). `!cancelled()` plus the
      # fix-step conclusion check skips collection and the gate on cancellation
      # and on setup/checkout failure, where the fix step never ran. The fix
      # step is not continue-on-error, so a lint failure always fails the job.
      #
      # Deliberately not run here: `yarn generate:news-feed`. It reads the
      # committed blog posts (no network), but it is only relevant to PRs that
      # touch the blog, feed or generator, so it stays in the path-filtered
      # news-feed-check.yml. That check regenerates the feed in its own
      # ephemeral CI checkout and fails if the result differs from the
      # committed packages/desktop-client/src/data/news.json; it never commits
      # or pushes a refreshed file: run `yarn generate:news-feed` and commit
      # the result.
      - name: Apply format and lint fixes
        id: fix
        run: yarn lint:fix
      - name: Collect fix patch
        id: patch
        if: ${{ !cancelled() && (steps.fix.conclusion == 'success' || steps.fix.conclusion == 'failure') }}
        env:
          PATCH_PATH: ${{ runner.temp }}/autofix/autofix.patch
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No format or lint changes."
            echo "dirty=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$(dirname "$PATCH_PATH")"
          git status --short
          # --intent-to-add so brand-new (untracked) files appear in the patch
          git add --intent-to-add .
          git diff > "$PATCH_PATH"
          git diff --stat
          echo "dirty=true" >> "$GITHUB_OUTPUT"
      - name: Upload autofix patch
        if: ${{ !cancelled() && steps.patch.outputs.dirty == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix/autofix.patch
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if fixes were needed
        if: ${{ !cancelled() && (steps.fix.conclusion == 'success' || steps.fix.conclusion == 'failure') }}
        env:
          FIX_OUTCOME: ${{ steps.fix.outcome }}
          DIRTY: ${{ steps.patch.outputs.dirty }}
        run: |
          rc=0
          if [ "$FIX_OUTCOME" = "failure" ]; then
            echo "::error title=Unfixable lint error::'yarn lint:fix' failed on a non-autofixable error. Fix it manually (see the 'Apply format and lint fixes' step log)."
            rc=1
          fi
          if [ "$DIRTY" = "true" ]; then
            echo "::error title=Format/lint fixes needed::'yarn lint:fix' changed files. Run 'yarn lint:fix' locally and commit the result, or apply the 'autofix-patch' artifact with 'git apply autofix.patch'."
            rc=1
          fi
          [ "$rc" -eq 0 ] && echo "No format or lint fixes needed."
          exit "$rc"
