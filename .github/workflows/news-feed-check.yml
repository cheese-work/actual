name: News feed check

# The in-app notifications feed (packages/desktop-client/src/data/news.json) is
# generated from the blog and committed so it can be reviewed. This check
# regenerates it from the committed blog posts (no network) and fails the PR if
# the committed copy is out of date. It validates only: it does not commit a
# refreshed feed, so run `yarn generate:news-feed` and commit the result.

on:
  pull_request:
    paths:
      - 'packages/docs/blog/**'
      - 'packages/desktop-client/src/data/news.json'
      - 'packages/ci-actions/src/news-feed/**'
      - 'packages/ci-actions/bin/generate-news-feed.ts'
      - '.github/workflows/news-feed-check.yml'

permissions:
  contents: read

jobs:
  check-news-feed:
    runs-on: ubuntu-latest
    name: Ensure news.json is up to date
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'

      - name: Regenerate news feed
        run: yarn generate:news-feed

      - name: Verify the committed feed matches
        run: |
          set -euo pipefail

          if ! git diff --quiet -- packages/desktop-client/src/data/news.json; then
            git --no-pager diff -- packages/desktop-client/src/data/news.json
            echo "::error file=packages/desktop-client/src/data/news.json::news.json is out of date. Run \`yarn generate:news-feed\` and commit the result (this check does not commit it for you)."
            exit 1
          fi

          echo "news.json is up to date."
